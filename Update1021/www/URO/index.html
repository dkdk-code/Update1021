		function submit() {
			var m_user_name = DOMPurify.sanitize($('#m_user_name').val());
			var m_mobile = DOMPurify.sanitize($('#m_mobile').val());
			var m_gender = $('input:radio[name="m_gender"]:checked').val();
			var captchaId = $('.hd_captchaId').val();
			var captchaValue = $('#inputCaptchaValue').val();

			if (!chkInfo(m_user_name, m_gender, m_mobile, captchaValue)) {
				sendClickUser();
				return;
			}

			sendData(m_user_name, m_gender, m_mobile, captchaValue, captchaId);
			sendGA4Purchase(m_gender);
		}

		function chkInfo(m_user_name, m_gender, m_mobile, captchaValue) {
			if (m_user_name == "") {
				alert("請輸入中文姓名。");
				return false;
			}

			if (!isCNString(m_user_name)) {
				alert("姓名內含有特殊符號或英文、數字請正確填寫。");
				return false;
			}

			if (typeof (m_gender) == "undefined") {
				alert("請選擇性別。");
				return false;
			}

			if ((m_gender != "1") && (m_gender != "2")) {
				alert("請選擇性別。");
				return false;
			}

			if (m_mobile == "") {
				alert("請輸入您的手機號碼。");
				return false;
			}

			if (!CheckMobile(m_mobile)) {
				alert("請輸入正確的手機號碼。");
				return false;
			}

			if (captchaValue == "") {
				alert("請輸入驗證碼。");
				return false;
			}

			if (!($('#CheckBox1').prop('checked'))) {
				alert("請勾選閱讀並同意「友邦人壽蒐集、處理及利用個人資料之告知事項」。");
				return false;
			}

			return true;
		}

		function CheckMobile(objMobile) {
			var mobile = objMobile;
			var rege = /^09[0-9]{8}$/;
			if (mobile.length == 0 || rege.exec(mobile) == null) {
				return false;
			}
			return true;
		}

		function isCNString(x) {
			var reg = /^[\u4E00-\u9FA5]+$/;
			if (reg.test(x)) {
				return true
			} else {
				return false
			}
		}
